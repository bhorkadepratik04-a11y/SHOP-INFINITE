<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Signup UI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{  
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2c2c54,#40407a);
}

/* MAIN BOX */
.container{
display:flex;
width:900px;
height:550px;
background:#1e1e2f;
border-radius:20px;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,0.5);
}

/* LEFT IMAGE */
.left{
width:50%;
background:url("https://images.unsplash.com/photo-1501785888041-af3ef285b470") center/cover;
position:relative;
}

.left::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to top,rgba(0,0,0,0.6),transparent);
}

.left-text{
position:absolute;
bottom:40px;
left:30px;
color:#fff;
z-index:2;
}

.left-text h2{
font-size:22px;
font-weight:600;
}

/* RIGHT FORM */
.right{
width:50%;
padding:40px;
display:flex;
flex-direction:column;
justify-content:center;
color:#fff;
}

/* TABS */
.tabs{
display:flex;
margin-bottom:20px;
}

.tabs button{
flex:1;
padding:10px;
border:none;
background:#2c2c54;
color:#aaa;
cursor:pointer;
transition:0.3s;
border-radius:10px;
}

.tabs button.active{
background:#706fd3;
color:#fff;
}

/* FORM */
.form{
display:none;
animation:fade 0.5s ease;
}

.form.active{
display:block;
}

@keyframes fade{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
background:#2c2c54;
color:#fff;
}

input:focus{
outline:none;
box-shadow:0 0 10px #706fd3;
}

/* BUTTON */
.btn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#706fd3;
color:#fff;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
background:#8c7ae6;
}

/* RESPONSIVE */
@media(max-width:768px){
.container{
flex-direction:column;
width:95%;
height:auto;
}

.left{
height:200px;
width:100%;
}

.right{
width:100%;
}
}
</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="left">
<div class="left-text">
<h2>Capturing Moments,<br>Creating Memories</h2>
</div>
</div>

<!-- RIGHT -->
<div class="right">

<div class="tabs">
<button class="tab active" onclick="switchTab('login', this)">Login</button>
<button class="tab" onclick="switchTab('signup', this)">Signup</button>
</div>

<!-- LOGIN -->
<div id="login" class="form active">
<h2>Welcome Back</h2>

<form method="POST" action="/login">
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    
    <button type="submit" class="btn">Login</button>
</form>

</div>

<!-- SIGNUP -->
<div id="signup" class="form">
<h2>Create Account</h2>

<form method="POST" action="/signup">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>

    <button type="submit" class="btn">Signup</button>
</form>

</div>
<script>
function switchTab(tab){
document.querySelectorAll('.form').forEach(f=>f.classList.remove('active'));
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));

document.getElementById(tab).classList.add('active');
event.target.classList.add('active');
}
</script>

</body>
</html>
