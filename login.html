<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Infinite - Login / Signup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        /* MAIN BOX */
        .container {
            display: flex;
            width: 900px;
            height: 600px;
            background: rgba(30, 30, 47, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        /* LEFT IMAGE */
        .left {
            width: 50%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url("https://images.unsplash.com/photo-1501785888041-af3ef285b470") center/cover;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 2rem;
        }

        .left-text {
            color: #fff;
            z-index: 2;
        }

        .left-text h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .left-text p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* RIGHT FORM */
        .right {
            width: 50%;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #fff;
        }

        /* TABS */
        .tabs {
            display: flex;
            margin-bottom: 2rem;
            background: rgba(44, 44, 84, 0.6);
            border-radius: 15px;
            padding: 4px;
            backdrop-filter: blur(10px);
        }

        .tabs button {
            flex: 1;
            padding: 1rem;
            border: none;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
        }

        .tabs button.active {
            background: linear-gradient(135deg, #8b5cf6 0%, #667eea 100%);
            color: #fff;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
        }

        /* FORM */
        .form {
            display: none;
            animation: fadeInUp 0.5s ease;
        }

        .form.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            margin: 1rem 0;
            border: none;
            border-radius: 15px;
            background: rgba(44, 44, 84, 0.8);
            color: #fff;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #aaa;
        }

        input:focus {
            outline: none;
            background: rgba(44, 44, 84, 1);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
            transform: translateY(-2px);
        }

        /* BUTTON */
        .btn {
            width: 100%;
            padding: 1.2rem;
            margin-top: 1.5rem;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #8b5cf6 0%, #667eea 100%);
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(139, 92, 246, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 2px solid transparent;
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* SUCCESS MESSAGE */
        .success-message {
            display: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            text-align: center;
            font-weight: 600;
            animation: slideIn 0.5s ease;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                width: 95%;
                height: auto;
                max-height: 90vh;
            }

            .left {
                height: 250px;
                width: 100%;
                padding: 1.5rem;
            }

            .right {
                width: 100%;
                padding: 2rem;
            }

            .left-text h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LEFT -->
        <div class="left">
            <div class="left-text">
                <h1>Shop Infinite</h1>
                <p>Discover the best brands in one place ✨</p>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="right">
            <div class="tabs">
                <button class="tab active" onclick="switchTab(event, 'login')">Login</button>
                <button class="tab" onclick="switchTab(event, 'signup')">Signup</button>
            </div>

            <!-- LOGIN -->
            <div id="login" class="form active">
                <h2>Welcome Back</h2>
                <form onsubmit="login(event)">
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    <button type="submit" class="btn" id="loginBtn">Login Now</button>
                </form>
                <div id="loginSuccess" class="success-message"></div>
            </div>

            <!-- SIGNUP -->
            <div id="signup" class="form">
                <h2>Create Account</h2>
                <form onsubmit="signup(event)">
                    <input type="text" id="name" placeholder="Full Name" required>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required>
                    <input type="password" id="signupPassword" placeholder="Enter your password (min 6 chars)" required>
                    <button type="submit" class="btn" id="signupBtn">Create Account</button>
                </form>
                <div id="signupSuccess" class="success-message"></div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(e, tab) {
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

            document.getElementById(tab).classList.add('active');
            e.target.classList.add('active');
            
            // Clear previous success messages
            document.getElementById('loginSuccess').classList.remove('show');
            document.getElementById('signupSuccess').classList.remove('show');
        }

        // SIGNUP FUNCTION - FIXED!
        function signup(e) {
            e.preventDefault();
            
            const btn = document.getElementById('signupBtn');
            const successMsg = document.getElementById('signupSuccess');
            
            // Show loading
            btn.classList.add('loading');
            btn.textContent = '';
            
            setTimeout(() => {
                let name = document.getElementById("name").value.trim();
                let email = document.getElementById("signupEmail").value.trim().toLowerCase();
                let password = document.getElementById("signupPassword").value;

                // VALIDATION
                if (name.length < 2) {
                    alert("❌ Name must be at least 2 characters");
                    btn.classList.remove('loading');
                    btn.textContent = 'Create Account';
                    return;
                }

                if (!email.includes('@') || !email.includes('.') || email.length < 5) {
                    alert("❌ Please enter a valid email");
                    btn.classList.remove('loading');
                    btn.textContent = 'Create Account';
                    return;
                }

                if (password.length < 6) {
                    alert("❌ Password must be at least 6 characters");
                    btn.classList.remove('loading');
                    btn.textContent = 'Create Account';
                    return;
                }

                // Check if user already exists
                if (localStorage.getItem(email)) {
                    alert("❌ Account with this email already exists!");
                    btn.classList.remove('loading');
                    btn.textContent = 'Create Account';
                    return;
                }

                // CREATE USER
                let user = { name, email, password };
                localStorage.setItem(email, JSON.stringify(user));
                localStorage.setItem("loggedInUser", name);
                
                // SUCCESS MESSAGE
                successMsg.innerHTML = `✅ Account created successfully!<br><strong>${name}</strong>, redirecting...`;
                successMsg.classList.add('show');
                
                btn.classList.remove('loading');
                btn.textContent = 'Account Created!';
                
                // FORCE REDIRECT AFTER 1.5 SECONDS
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);
                
            }, 500); // Simulate network delay
        }

        // LOGIN FUNCTION - FIXED!
        function login(e) {
            e.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            const successMsg = document.getElementById('loginSuccess');
            
            // Show loading
            btn.classList.add('loading');
            btn.textContent = '';
            
            setTimeout(() => {
                let email = document.getElementById("loginEmail").value.trim().toLowerCase();
                let password = document.getElementById("loginPassword").value;

                let user = JSON.parse(localStorage.getItem(email));

                if (user && user.password === password) {
                    localStorage.setItem("loggedInUser", user.name);
                    
                    // SUCCESS MESSAGE
                    successMsg.innerHTML = `✅ Welcome back, <strong>${user.name}</strong>!<br>Redirecting to dashboard...`;
                    successMsg.classList.add('show');
                    
                    btn.classList.remove('loading');
                    btn.textContent = 'Logged In!';
                    
                    // FORCE REDIRECT
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1500);
                } else {
                    alert("❌ Invalid email or password");
                    btn.classList.remove('loading');
                    btn.textContent = 'Login Now';
                    document.getElementById("loginEmail").focus();
                }
                
            }, 500);
        }

        // Enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const activeForm = document.querySelector('.form.active');
                if (activeForm.id === 'login') {
                    login(e);
                } else {
                    signup(e);
                }
            }
        });

        // Auto-focus first input
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loginEmail').focus();
        });
    </script>
</body>
</html>
